<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Link Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bar:#0E1C20;--bar-ink:#E8EFEB;--bar-mute:#80979B;
    --field:#EEF0EB;--surface:#FBFCF9;--ink:#101A1C;--mute:#657679;
    --line:rgba(16,26,28,.13);--hover:rgba(16,26,28,.045);
    --accent:#F2A33C;--accent-ink:#231604;--danger:#C4432F;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bar:#070F11;--field:#0B1316;--surface:#131E21;--ink:#E7EDEA;--mute:#87999D;
      --line:rgba(231,237,234,.15);--hover:rgba(231,237,234,.06);
      --accent:#F2A33C;--accent-ink:#1A1003;--danger:#F08A74;color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bar:#070F11;--field:#0B1316;--surface:#131E21;--ink:#E7EDEA;--mute:#87999D;
    --line:rgba(231,237,234,.15);--hover:rgba(231,237,234,.06);
    --accent:#F2A33C;--accent-ink:#1A1003;--danger:#F08A74;color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 24px)}
  body{margin:0;background:var(--field);color:var(--ink);
       font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;
       -webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:60}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  [hidden]{display:none !important}
  .wrap{max-width:900px;margin:0 auto;padding:0 32px}

  .bar{background:var(--bar);color:var(--bar-ink)}
  .bar-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0}
  .keyhole{width:11px;height:11px;border-radius:50%;background:var(--accent);flex:none}
  .who{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--bar-mute);min-width:0}
  .who button{background:none;border:0;color:var(--bar-mute);cursor:pointer;padding:3px 6px;border-radius:6px;font-size:13px}
  .who button:hover{color:var(--bar-ink);background:rgba(232,239,235,.09)}
  .who .name{color:var(--bar-ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .av{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;
      font-size:10px;font-weight:600;color:#fff;background:#4A5D61;line-height:1}

  .mast{padding:44px 0 0}
  .mast h1{margin:0;font-family:"Bricolage Grotesque",Archivo,sans-serif;font-weight:800;
           letter-spacing:-.045em;line-height:.95;font-size:clamp(42px,8vw,76px)}
  .mast .sub{margin:14px 0 0;color:var(--mute);font-size:15px;max-width:52ch}
  .toolbar{margin:30px 0 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .search{flex:1 1 240px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);padding:9px 2px}
  .search:focus-within{border-color:var(--ink)}
  .search input{border:0;background:none;outline:none;width:100%;font-size:15px;min-width:0}
  .search input::placeholder{color:var(--mute)}
  .search svg{color:var(--mute);flex:none}

  .btn{border:0;border-radius:8px;cursor:pointer;padding:10px 16px;font-size:14px;font-weight:600;
       display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
  .btn-primary{background:var(--accent);color:var(--accent-ink)}
  .btn-primary:hover{filter:brightness(1.07)}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
  .btn-quiet{background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:500}
  .btn-quiet:hover{color:var(--ink);background:var(--hover)}
  .btn-ghost-danger{background:transparent;color:var(--danger);border:1px solid transparent;margin-right:auto;font-weight:500}
  .btn-ghost-danger:hover{border-color:var(--danger)}
  .btn-sm{padding:6px 12px;font-size:13px}

  .jump{margin:22px 0 0;display:flex;gap:8px;flex-wrap:wrap}
  .jump a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);
          border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:13px}
  .jump a:hover{border-color:var(--ink)}
  .jump .swatch{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
  .jump .n{color:var(--mute);font-variant-numeric:tabular-nums}

  .sections{padding:14px 0 90px}
  .sec{margin-top:54px;scroll-margin-top:24px}
  .sec-head{display:flex;align-items:baseline;gap:12px;padding-bottom:14px;border-bottom:2px solid var(--c,var(--line))}
  .sec-head .swatch{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none;transform:rotate(45deg);align-self:center}
  .sec-head h3{margin:0;font-family:"Bricolage Grotesque",Archivo,sans-serif;font-weight:700;
               font-size:27px;letter-spacing:-.03em;min-width:0;overflow-wrap:anywhere}
  .sec-head .n{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;flex:1 1 auto}
  .sec-acts{display:flex;gap:4px;align-self:center}

  .list{list-style:none;margin:0;padding:0}
  .row{display:grid;grid-template-columns:42px 1fr auto;gap:16px;align-items:start;
       padding:20px 0;border-bottom:1px solid var(--line)}
  .mono-tile{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;
             background:color-mix(in srgb,var(--c,var(--accent)) 20%,transparent);
             color:var(--c,var(--accent));border:1px solid color-mix(in srgb,var(--c,var(--accent)) 35%,transparent);
             font-family:"Bricolage Grotesque",Archivo,sans-serif;font-weight:700;font-size:19px;line-height:1}
  .row-main{min-width:0}
  .row-title{font-family:"Bricolage Grotesque",Archivo,sans-serif;font-weight:600;font-size:19px;
             letter-spacing:-.018em;text-decoration:none;display:inline-block;max-width:100%;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
  .row-title:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
  .row-note{margin:7px 0 0;font-size:14.5px;max-width:62ch}
  .row-by{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
  .row-by .av{width:19px;height:19px;font-size:9px}
  .by-name{color:var(--ink);font-weight:500}
  .bar-sep{width:1px;height:11px;background:var(--line)}
  .row-url{display:inline-block;max-width:100%;margin-top:10px;color:var(--c,var(--accent));
           font-size:13px;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
           vertical-align:bottom;border-bottom:1px solid color-mix(in srgb,var(--c,var(--accent)) 45%,transparent)}
  .row-url:hover{border-bottom-color:currentColor}
  .row-acts{display:flex;gap:2px;opacity:.5;transition:opacity .12s ease}
  .row:hover .row-acts,.row:focus-within .row-acts{opacity:1}
  .icon-btn{border:0;background:none;color:var(--mute);cursor:pointer;padding:7px;border-radius:7px;line-height:0}
  .icon-btn:hover{background:var(--hover);color:var(--ink)}
  .icon-btn.danger:hover{color:var(--danger)}
  .sec-empty{padding:22px 0;border-bottom:1px solid var(--line);color:var(--mute);font-size:14px;
             display:flex;align-items:center;gap:14px;flex-wrap:wrap}

  .blank{padding:64px 0 90px;max-width:560px}
  .blank h3{font-family:"Bricolage Grotesque",Archivo,sans-serif;font-weight:600;font-size:25px;letter-spacing:-.03em;margin:0 0 10px}
  .blank p{margin:0 0 22px;color:var(--mute)}
  .notice{margin:22px 0 0;padding:11px 14px;border-radius:8px;border:1px solid var(--line);
          background:var(--surface);color:var(--mute);font-size:13.5px}
  .notice.bad{border-color:var(--danger);color:var(--danger)}

  dialog{border:0;padding:0;background:transparent;max-width:100%}
  dialog::backdrop{background:rgba(6,14,16,.55)}
  .sheet{background:var(--surface);color:var(--ink);border-radius:14px;width:min(520px,calc(100vw - 32px));
         padding:26px 26px 22px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(6,14,16,.28)}
  .sheet h3{margin:0 0 20px;font-family:"Bricolage Grotesque",Archivo,sans-serif;font-weight:700;font-size:22px;letter-spacing:-.03em}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;background:var(--field);border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;outline:none;font-size:14.5px}
  .field textarea{resize:vertical;min-height:72px;line-height:1.45}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
  .hint{font-size:12.5px;color:var(--mute);margin-top:6px}
  .err{font-size:13px;color:var(--danger);margin:-6px 0 14px}
  .colors{display:flex;gap:9px;flex-wrap:wrap}
  .color{width:28px;height:28px;border-radius:8px;border:2px solid transparent;cursor:pointer;background:var(--c);padding:0}
  .color[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.08)}
  .sheet-acts{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}

  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);
         bottom:calc(26px + env(safe-area-inset-bottom,0px));background:var(--bar);color:var(--bar-ink);
         padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;
         transition:opacity .18s ease,transform .18s ease;z-index:80;max-width:calc(100vw - 32px);text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:680px){
    .wrap{padding:0 18px}
    .mast{padding:30px 0 0}
    .sec{margin-top:40px}
    .sec-head h3{font-size:23px}
    .row{grid-template-columns:36px 1fr;gap:13px;padding:18px 0}
    .mono-tile{width:36px;height:36px;font-size:16px}
    .row-acts{opacity:1;grid-column:2;margin-left:-7px}
    .toolbar .btn{flex:1 1 auto;justify-content:center}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<div class="bar">
  <div class="wrap bar-in">
    <span class="keyhole"></span>
    <div class="who">
      <span class="av" id="meAv"></span>
      <span class="name" id="meName">…</span>
      <button type="button" id="renameBtn">Change name</button>
    </div>
  </div>
</div>

<div class="wrap mast">
  <h1>Link Vault</h1>
  <p class="sub" id="sub">Loading the vault…</p>
  <div class="toolbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input id="search" type="search" placeholder="Search every department" autocomplete="off">
    </div>
    <button class="btn btn-primary" id="newDeptBtn">New department</button>
  </div>
  <nav class="jump" id="jump" aria-label="Jump to a department"></nav>
  <div id="notice"></div>
</div>

<div class="wrap sections" id="sections"></div>

<dialog id="linkDlg"><form method="dialog" class="sheet" id="linkForm">
  <h3 id="linkDlgTitle">Add a link</h3>
  <div class="field"><label for="f-url">Address</label>
    <input id="f-url" type="text" inputmode="url" placeholder="figma.com/file/brand-kit" required></div>
  <div class="field"><label for="f-title">File name</label>
    <input id="f-title" type="text" placeholder="Brand kit 2026" maxlength="90"></div>
  <div class="field"><label for="f-note">Description</label>
    <textarea id="f-note" placeholder="Logos, type and colour specs. Use this one, not the old Drive folder." maxlength="400"></textarea></div>
  <div class="field"><label for="f-dept">Department</label><select id="f-dept"></select></div>
  <p class="err" id="linkErr"></p>
  <div class="sheet-acts">
    <button type="button" class="btn btn-quiet" data-close>Cancel</button>
    <button type="submit" class="btn btn-primary">Save link</button>
  </div>
</form></dialog>

<dialog id="deptDlg"><form method="dialog" class="sheet" id="deptForm">
  <h3 id="deptDlgTitle">New department</h3>
  <div class="field"><label for="d-name">Name</label>
    <input id="d-name" type="text" placeholder="Marketing" maxlength="36" required></div>
  <div class="field"><label>Colour</label><div class="colors" id="colorRow"></div>
    <p class="hint">The colour tags every link filed here.</p></div>
  <p class="err" id="deptErr"></p>
  <div class="sheet-acts">
    <button type="button" class="btn btn-ghost-danger" id="deptDelete" hidden>Remove department</button>
    <button type="button" class="btn btn-quiet" data-close>Cancel</button>
    <button type="submit" class="btn btn-primary" id="deptSave">Create department</button>
  </div>
</form></dialog>

<dialog id="nameDlg"><form method="dialog" class="sheet" id="nameForm">
  <h3 id="nameDlgTitle">What should we call you?</h3>
  <div class="field"><label for="n-name">This name shows beside every link you add</label>
    <input id="n-name" type="text" maxlength="48" placeholder="Priya Sharma" required></div>
  <p class="hint">Saved on this device only. Change it any time from the bar at the top.</p>
  <p class="err" id="nameErr"></p>
  <div class="sheet-acts">
    <button type="button" class="btn btn-quiet" data-close id="nameCancel">Cancel</button>
    <button type="submit" class="btn btn-primary">Save name</button>
  </div>
</form></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";

  /* ============================================================
     CONFIG — Supabase project URL and publishable key.
     Anyone with this page's address can read and change the
     vault. There is no sign-in by design.
     ============================================================ */
  var SUPABASE_URL      = "https://vczilvbjagtsvdcpmmky.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_B7oqv-eQ0gW8FotglxmdFw_Dm3UYv2p";
  /* ========================================================== */

  var PALETTE = ["#F2A33C","#E8614A","#17A2A2","#7A5CF0","#D8508F","#3F9150","#3B82D9","#B4703F"];
  var UNFILED = "#8A9497";
  var NAME_KEY = "linkvault.name";

  var supa = null, myName = "";
  var state = {depts:[], links:[], q:"", editing:null, editingDept:null, pickedColor:PALETTE[0], loaded:false};

  var $ = function(id){ return document.getElementById(id); };
  var el = {
    meAv:$("meAv"), meName:$("meName"), renameBtn:$("renameBtn"),
    sections:$("sections"), jump:$("jump"), sub:$("sub"), newDeptBtn:$("newDeptBtn"),
    search:$("search"), notice:$("notice"), toast:$("toast"),
    linkDlg:$("linkDlg"), linkForm:$("linkForm"), linkDlgTitle:$("linkDlgTitle"), linkErr:$("linkErr"),
    deptDlg:$("deptDlg"), deptForm:$("deptForm"), deptErr:$("deptErr"), deptDlgTitle:$("deptDlgTitle"),
    deptSave:$("deptSave"), deptDelete:$("deptDelete"), colorRow:$("colorRow"),
    fUrl:$("f-url"), fTitle:$("f-title"), fNote:$("f-note"), fDept:$("f-dept"), dName:$("d-name"),
    nameDlg:$("nameDlg"), nameForm:$("nameForm"), nName:$("n-name"), nameErr:$("nameErr"),
    nameDlgTitle:$("nameDlgTitle"), nameCancel:$("nameCancel")
  };

  /* ---------- helpers ---------- */
  function normalizeUrl(raw){
    var s = String(raw||"").trim();
    if(!s) return null;
    if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = "https://" + s;
    try{
      var u = new URL(s);
      if(u.protocol !== "http:" && u.protocol !== "https:") return null;
      if(!u.hostname || u.hostname.indexOf(".") === -1) return null;
      return u.href;
    }catch(e){ return null; }
  }
  function host(url){ try{ return new URL(url).hostname.replace(/^www\./,""); }catch(e){ return url; } }
  function prettyUrl(url){
    try{
      var u = new URL(url);
      var s = u.hostname.replace(/^www\./,"") + (u.pathname === "/" ? "" : u.pathname) + u.search;
      return s.length > 70 ? s.slice(0,68) + "…" : s;
    }catch(e){ return url; }
  }
  function monogram(url){ var h = host(url).replace(/^[^a-z0-9]+/i,""); return (h.charAt(0)||"?").toUpperCase(); }
  function ago(iso){
    var t = Date.parse(iso); if(isNaN(t)) return "";
    var s = Math.max(0,(Date.now()-t)/1000);
    if(s < 90) return "just now";
    var m = s/60; if(m < 60) return Math.round(m) + " min ago";
    var h = m/60; if(h < 24) return Math.round(h) + (Math.round(h)===1?" hour ago":" hours ago");
    var d = h/24; if(d < 7) return Math.round(d) + (Math.round(d)===1?" day ago":" days ago");
    var w = d/7; if(w < 5) return Math.round(w) + (Math.round(w)===1?" week ago":" weeks ago");
    var mo = d/30.4; if(mo < 12) return Math.round(mo) + (Math.round(mo)===1?" month ago":" months ago");
    return Math.round(d/365) + " yr ago";
  }
  function toast(msg){
    el.toast.textContent = msg; el.toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.toast.classList.remove("show"); }, 2600);
  }
  function deptById(id){
    for(var i=0;i<state.depts.length;i++) if(state.depts[i].id===id) return state.depts[i];
    return null;
  }
  function svg(p,w){
    return '<svg width="'+(w||16)+'" height="'+(w||16)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
  }
  var ICON = {
    copy: svg('<rect x="9" y="9" width="11" height="11" rx="2.2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>'),
    open: svg('<path d="M14 5h5v5M19 5l-8 8"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>'),
    edit: svg('<path d="M4 20h4L19 9a2.3 2.3 0 0 0-3.2-3.2L5 16.7V20z"/>'),
    trash: svg('<path d="M4 7h16M10 7V5h4v2M6 7l1 13h10l1-13"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>')
  };
  function slug(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "dept"; }
  function tint(s){
    var n = 0; s = String(s||"");
    for(var i=0;i<s.length;i++) n = (n*31 + s.charCodeAt(i)) >>> 0;
    return PALETTE[n % PALETTE.length];
  }
  function fillAvatar(node, name){
    node.textContent = (String(name||"?").trim().charAt(0) || "?").toUpperCase();
    node.style.background = tint(name);
  }

  /* ---------- grouping ---------- */
  function matches(l){
    var q = state.q.trim().toLowerCase();
    if(!q) return true;
    var dn = (deptById(l.dept_id) || {name:"Unfiled"}).name;
    return (l.title||"").toLowerCase().indexOf(q) > -1
        || (l.note||"").toLowerCase().indexOf(q) > -1
        || (l.url||"").toLowerCase().indexOf(q) > -1
        || dn.toLowerCase().indexOf(q) > -1
        || (l.added_by_name||"").toLowerCase().indexOf(q) > -1;
  }
  function groups(){
    var searching = !!state.q.trim(), byDept = {};
    state.links.filter(matches).forEach(function(l){
      var k = deptById(l.dept_id) ? l.dept_id : "__unfiled";
      (byDept[k] = byDept[k] || []).push(l);
    });
    var out = [];
    state.depts.forEach(function(d){
      var items = byDept[d.id] || [];
      if(searching && !items.length) return;
      out.push({id:d.id, name:d.name, color:d.color, items:items, real:true});
    });
    if(byDept.__unfiled) out.push({id:"__unfiled", name:"Unfiled", color:UNFILED, items:byDept.__unfiled, real:false});
    return out;
  }

  /* ---------- render ---------- */
  function render(){
    var gs = groups();
    var shown = gs.reduce(function(n,g){ return n + g.items.length; }, 0);
    renderSub(shown);
    renderJump(gs);

    el.sections.innerHTML = "";
    if(!state.loaded) return;

    if(!state.depts.length && !state.links.length){
      el.sections.appendChild(blank(
        "Start with a department",
        "Make a shelf for each team or topic — Design, Finance, Onboarding — then file links on it. Everything lands on this one page.",
        {label:"Create a department", fn:function(){ openDept(null); }}));
      return;
    }
    if(!gs.length){
      el.sections.appendChild(blank(
        state.q ? "No match for “" + state.q + "”" : "Nothing filed yet",
        state.q ? "Try part of the address, or clear the search to see every department."
                : "Your departments are ready. Add the first link and it will appear under its heading.",
        (!state.q && state.depts.length) ? {label:"Add the first link", fn:function(){ openLink(null, state.depts[0].id); }} : null));
      return;
    }
    gs.forEach(function(g){ el.sections.appendChild(section(g)); });
  }

  function renderSub(shown){
    if(!state.loaded){ el.sub.textContent = "Loading the vault…"; return; }
    if(state.q.trim()){
      el.sub.textContent = shown + (shown===1 ? " link matches " : " links match ") + "“" + state.q.trim() + "”.";
      return;
    }
    var seen = {};
    state.links.forEach(function(l){ if(l.added_by_name) seen[l.added_by_name] = 1; });
    var pc = Object.keys(seen).length, nd = state.depts.length, nl = state.links.length;
    if(!nl && !nd){ el.sub.textContent = "Nothing here yet. Departments and their links will show up on this page."; return; }
    el.sub.textContent = nl + (nl===1?" link":" links") + " across " + nd + (nd===1?" department":" departments")
      + (pc ? ", kept by " + pc + (pc===1?" person":" people") : "") + ".";
  }

  function renderJump(gs){
    el.jump.innerHTML = "";
    if(gs.length < 3){ el.jump.hidden = true; return; }
    el.jump.hidden = false;
    gs.forEach(function(g){
      var a = document.createElement("a");
      a.href = "#sec-" + slug(g.name) + "-" + g.id;
      a.style.setProperty("--c", g.color);
      var s = document.createElement("span"); s.className = "swatch";
      var t = document.createElement("span"); t.textContent = g.name;
      var n = document.createElement("span"); n.className = "n"; n.textContent = String(g.items.length);
      a.appendChild(s); a.appendChild(t); a.appendChild(n);
      el.jump.appendChild(a);
    });
  }

  function section(g){
    var sec = document.createElement("section");
    sec.className = "sec"; sec.id = "sec-" + slug(g.name) + "-" + g.id;
    sec.style.setProperty("--c", g.color);

    var head = document.createElement("header"); head.className = "sec-head";
    var sw = document.createElement("span"); sw.className = "swatch";
    var h = document.createElement("h3"); h.textContent = g.name;
    var n = document.createElement("span"); n.className = "n";
    n.textContent = g.items.length + (g.items.length===1 ? " link" : " links");
    head.appendChild(sw); head.appendChild(h); head.appendChild(n);

    if(g.real){
      var acts = document.createElement("div"); acts.className = "sec-acts";
      acts.appendChild(iconBtn(ICON.plus, "Add a link to " + g.name, function(){ openLink(null, g.id); }));
      acts.appendChild(iconBtn(ICON.edit, "Edit " + g.name, function(){ openDept(deptById(g.id)); }));
      head.appendChild(acts);
    }
    sec.appendChild(head);

    if(!g.items.length){
      var e = document.createElement("div"); e.className = "sec-empty";
      var txt = document.createElement("span"); txt.textContent = "Nothing filed here yet.";
      var b = document.createElement("button");
      b.className = "btn btn-quiet btn-sm"; b.type = "button"; b.textContent = "Add a link here";
      b.addEventListener("click", function(){ openLink(null, g.id); });
      e.appendChild(txt); e.appendChild(b);
      sec.appendChild(e);
      return sec;
    }

    var ul = document.createElement("ul"); ul.className = "list";
    g.items.forEach(function(l){ ul.appendChild(row(l, g.color)); });
    sec.appendChild(ul);
    return sec;
  }

  function row(l, color){
    var li = document.createElement("li"); li.className = "row";
    li.style.setProperty("--c", color);

    var tile = document.createElement("div");
    tile.className = "mono-tile"; tile.setAttribute("aria-hidden","true");
    tile.textContent = monogram(l.url);

    var main = document.createElement("div"); main.className = "row-main";

    var a = document.createElement("a");
    a.className = "row-title"; a.href = l.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.textContent = l.title || host(l.url);
    main.appendChild(a);

    if(l.note){
      var note = document.createElement("p"); note.className = "row-note"; note.textContent = l.note;
      main.appendChild(note);
    }

    var who = l.added_by_name || "Someone";
    var by = document.createElement("div"); by.className = "row-by";
    var av = document.createElement("span"); av.className = "av";
    fillAvatar(av, who);
    var nm = document.createElement("span"); nm.className = "by-name"; nm.textContent = who;
    by.appendChild(av); by.appendChild(nm);
    if(l.added_at){
      var sep = document.createElement("span"); sep.className = "bar-sep";
      var t = document.createElement("time"); t.dateTime = l.added_at; t.textContent = ago(l.added_at);
      by.appendChild(sep); by.appendChild(t);
    }
    main.appendChild(by);

    var u = document.createElement("a");
    u.className = "row-url"; u.href = l.url; u.target = "_blank"; u.rel = "noopener noreferrer";
    u.textContent = prettyUrl(l.url);
    main.appendChild(u);

    var acts = document.createElement("div"); acts.className = "row-acts";
    acts.appendChild(iconBtn(ICON.copy, "Copy address", function(){ copy(l.url); }));
    acts.appendChild(iconBtn(ICON.open, "Open in a new tab", function(){ window.open(l.url,"_blank","noopener"); }));
    acts.appendChild(iconBtn(ICON.edit, "Edit link", function(){ openLink(l, null); }));
    acts.appendChild(iconBtn(ICON.trash, "Remove link", function(){ removeLink(l); }, true));

    li.appendChild(tile); li.appendChild(main); li.appendChild(acts);
    return li;
  }

  function iconBtn(icon,label,fn,danger){
    var b = document.createElement("button");
    b.className = "icon-btn" + (danger ? " danger" : "");
    b.type = "button"; b.title = label; b.setAttribute("aria-label", label);
    b.innerHTML = icon; b.addEventListener("click", fn);
    return b;
  }

  function blank(title, body, action){
    var box = document.createElement("div"); box.className = "blank";
    var h = document.createElement("h3"); h.textContent = title;
    var p = document.createElement("p"); p.textContent = body;
    box.appendChild(h); box.appendChild(p);
    if(action){
      var b = document.createElement("button");
      b.className = "btn btn-primary"; b.type = "button"; b.textContent = action.label;
      b.addEventListener("click", action.fn);
      box.appendChild(b);
    }
    return box;
  }

  function showNotice(text, bad){
    el.notice.innerHTML = "";
    var n = document.createElement("div");
    n.className = "notice" + (bad ? " bad" : "");
    n.textContent = text;
    el.notice.appendChild(n);
  }

  function copy(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(
        function(){ toast("Address copied."); },
        function(){ toast("Could not copy. Open the link and copy from the address bar."); });
    }else{
      toast("Could not copy. Open the link and copy from the address bar.");
    }
  }

  /* ---------- data ---------- */
  function loadAll(){
    return Promise.all([
      supa.from("departments").select("*").order("created_at", {ascending:true}),
      supa.from("links").select("*").order("added_at", {ascending:false})
    ]).then(function(res){
      var bad = res.filter(function(r){ return r.error; })[0];
      if(bad) throw bad.error;
      state.depts = res[0].data || [];
      state.links = res[1].data || [];
      state.loaded = true;
      render();
    }).catch(function(err){
      state.loaded = true;
      showNotice("Could not load the vault: " + (err.message || "unknown error"), true);
      render();
    });
  }

  function watch(){
    supa.channel("vault")
      .on("postgres_changes", {event:"*", schema:"public", table:"links"}, loadAll)
      .on("postgres_changes", {event:"*", schema:"public", table:"departments"}, loadAll)
      .subscribe();
  }

  /* ---------- name ---------- */
  function loadName(){
    try{ myName = localStorage.getItem(NAME_KEY) || ""; }catch(e){ myName = ""; }
    paintMe();
  }
  function paintMe(){
    el.meName.textContent = myName || "Not set";
    fillAvatar(el.meAv, myName || "?");
  }
  function askName(first){
    el.nameErr.textContent = "";
    el.nName.value = myName;
    el.nameDlgTitle.textContent = first ? "What should we call you?" : "Change your name";
    el.nameCancel.hidden = !!first;
    el.nameDlg.showModal();
    setTimeout(function(){ el.nName.focus(); el.nName.select(); }, 30);
  }
  function needName(then){
    if(myName){ then(); return; }
    askName(true);
    state.after = then;
  }

  /* ---------- link dialog ---------- */
  function openLink(l, presetDept){
    if(!state.depts.length){ toast("Create a department first."); return; }
    needName(function(){
      state.editing = l || null;
      el.linkDlgTitle.textContent = l ? "Edit link" : "Add a link";
      el.linkErr.textContent = "";
      el.fUrl.value = l ? l.url : "";
      el.fTitle.value = l ? (l.title||"") : "";
      el.fNote.value = l ? (l.note||"") : "";
      el.fDept.innerHTML = "";
      state.depts.forEach(function(d){
        var o = document.createElement("option"); o.value = d.id; o.textContent = d.name;
        el.fDept.appendChild(o);
      });
      var want = l ? l.dept_id : (presetDept || state.depts[0].id);
      if(deptById(want)) el.fDept.value = want;
      el.linkDlg.showModal();
      setTimeout(function(){ el.fUrl.focus(); el.fUrl.select(); }, 30);
    });
  }

  function saveLink(){
    var url = normalizeUrl(el.fUrl.value);
    if(!url){ el.linkErr.textContent = "That address doesn’t look right. Try something like figma.com/file/brand-kit"; return; }
    var body = {
      url: url,
      title: el.fTitle.value.trim() || host(url),
      note: el.fNote.value.trim(),
      dept_id: el.fDept.value
    };
    var isNew = !state.editing;
    el.linkDlg.close();

    var op;
    if(isNew){
      body.added_by_name = myName;
      op = supa.from("links").insert(body);
    }else{
      body.edited_at = new Date().toISOString();
      op = supa.from("links").update(body).eq("id", state.editing.id);
    }
    op.then(function(r){
      if(r.error){ toast("That didn’t save: " + r.error.message); return; }
      toast(isNew ? "Link added." : "Link updated.");
      loadAll();
    });
  }

  function removeLink(l){
    if(!window.confirm("Remove “" + (l.title || host(l.url)) + "” from the vault?")) return;
    supa.from("links").delete().eq("id", l.id).then(function(r){
      if(r.error){ toast("Could not remove it: " + r.error.message); return; }
      toast("Link removed."); loadAll();
    });
  }

  /* ---------- department dialog ---------- */
  function openDept(d){
    state.editingDept = d || null;
    el.deptErr.textContent = "";
    el.deptDlgTitle.textContent = d ? "Edit department" : "New department";
    el.deptSave.textContent = d ? "Save changes" : "Create department";
    el.dName.value = d ? d.name : "";
    state.pickedColor = d ? d.color : PALETTE[state.depts.length % PALETTE.length];
    paintColors();
    var count = d ? state.links.filter(function(l){ return l.dept_id === d.id; }).length : 0;
    el.deptDelete.hidden = !d;
    el.deptDelete.textContent = count
      ? "Remove department and its " + count + (count===1 ? " link" : " links")
      : "Remove department";
    el.deptDlg.showModal();
    setTimeout(function(){ el.dName.focus(); el.dName.select(); }, 30);
  }

  function saveDept(){
    var name = el.dName.value.trim(), editing = state.editingDept;
    if(!name){ el.deptErr.textContent = "Give the department a name."; return; }
    var dupe = state.depts.some(function(d){
      return d.name.toLowerCase() === name.toLowerCase() && (!editing || d.id !== editing.id);
    });
    if(dupe){ el.deptErr.textContent = "There’s already a department called that."; return; }
    el.deptDlg.close();

    var op = editing
      ? supa.from("departments").update({name:name, color:state.pickedColor}).eq("id", editing.id)
      : supa.from("departments").insert({name:name, color:state.pickedColor});

    op.then(function(r){
      if(r.error){ toast("That didn’t save: " + r.error.message); return; }
      toast(editing ? "Department updated." : "Department created.");
      loadAll();
    });
  }

  function removeDept(d){
    if(!d) return;
    var kids = state.links.filter(function(l){ return l.dept_id === d.id; }).length;
    var msg = kids
      ? "Remove the " + d.name + " department and the " + kids + (kids===1?" link":" links") +
        " filed in it? This can’t be undone."
      : "Remove the " + d.name + " department?";
    if(!window.confirm(msg)) return;
    el.deptDlg.close();
    supa.from("departments").delete().eq("id", d.id).then(function(r){
      if(r.error){ toast("Could not remove it: " + r.error.message); return; }
      toast(kids ? "Department and its links removed." : "Department removed.");
      loadAll();
    });
  }

  function paintColors(){
    el.colorRow.innerHTML = "";
    PALETTE.forEach(function(c){
      var b = document.createElement("button");
      b.type = "button"; b.className = "color";
      b.style.setProperty("--c", c);
      b.setAttribute("aria-label", "Colour " + c);
      b.setAttribute("aria-pressed", String(c === state.pickedColor));
      b.addEventListener("click", function(){ state.pickedColor = c; paintColors(); });
      el.colorRow.appendChild(b);
    });
  }

  /* ---------- wiring ---------- */
  el.newDeptBtn.addEventListener("click", function(){ openDept(null); });
  el.deptDelete.addEventListener("click", function(){ removeDept(state.editingDept); });
  el.linkForm.addEventListener("submit", function(e){ e.preventDefault(); saveLink(); });
  el.deptForm.addEventListener("submit", function(e){ e.preventDefault(); saveDept(); });
  el.search.addEventListener("input", function(){ state.q = el.search.value; render(); });
  el.renameBtn.addEventListener("click", function(){ askName(false); });
  document.querySelectorAll("[data-close]").forEach(function(b){
    b.addEventListener("click", function(){ b.closest("dialog").close(); });
  });

  el.nameForm.addEventListener("submit", function(e){
    e.preventDefault();
    var v = el.nName.value.trim();
    if(!v){ el.nameErr.textContent = "Type a name so people know who filed what."; return; }
    myName = v;
    try{ localStorage.setItem(NAME_KEY, v); }catch(err){}
    el.nameDlg.close();
    paintMe();
    toast("Name saved.");
    if(state.after){ var f = state.after; state.after = null; setTimeout(f, 60); }
  });

  /* ---------- boot ---------- */
  paintColors();
  loadName();
  render();

  if(!window.supabase || !window.supabase.createClient){
    state.loaded = true;
    showNotice("The Supabase library could not load. Check your connection and reload the page.", true);
    render();
  }else{
    supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    loadAll().then(watch);
  }
})();
</script>
</body>
</html>
